<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zara Redesign Feedback</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F4F1;--card:#FFFFFF;--ink:#111111;--muted:#55524D;--line:#E4E1DB;--soft:#ECEAE5;--new:#15803D;--newbg:#DCFCE7;--old:#B42318;--oldbg:#FEE4E2;--warn:#9A3412;--warnbg:#FFEDD5;--info:#1D4ED8;--infobg:#DBEAFE;--focus:#2563EB;--same:#8A8A8A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0B0C;--card:#161618;--ink:#F2F2F2;--muted:#B3B0AA;--line:#2E2E31;--soft:#232326;--new:#4ADE80;--newbg:#0F2E1A;--old:#F87171;--oldbg:#3A1414;--warn:#FDBA74;--warnbg:#3A2210;--info:#93C5FD;--infobg:#132A4A;--focus:#60A5FA;--same:#A3A3A3}}
:root[data-theme="dark"]{--bg:#0B0B0C;--card:#161618;--ink:#F2F2F2;--muted:#B3B0AA;--line:#2E2E31;--soft:#232326;--new:#4ADE80;--newbg:#0F2E1A;--old:#F87171;--oldbg:#3A1414;--warn:#FDBA74;--warnbg:#3A2210;--info:#93C5FD;--infobg:#132A4A;--focus:#60A5FA;--same:#A3A3A3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{max-width:1440px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.top .t{display:flex;flex-direction:column}
.top b{font-size:16px}.top span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.tabs a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
#view-proto{max-width:1440px;margin:0 auto;padding:0 16px 32px}
.narrow-note{display:none;margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--infobg);color:var(--info);font-size:13px}
@media (max-width:900px){.narrow-note{display:block}}
#stage-wrap{position:relative;width:100%;overflow:hidden;border-radius:16px}
#stage{position:absolute;left:0;top:0;width:1400px;height:1160px;transform-origin:0 0}
#view-results{max-width:1100px;margin:0 auto;padding:8px 16px 64px}
.res{display:flex;flex-direction:column;gap:16px}
.res h2{font-size:20px;margin:8px 0 0}.res h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{font-size:13px;color:var(--muted)}
.c-new{color:var(--new)}.c-old{color:var(--old)}.c-warn{color:var(--warn)}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
ol.rank{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
ol.rank li span{margin-right:8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:0}
.fname{font-weight:600}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num{text-align:center;font-variant-numeric:tabular-nums}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);min-width:140px}
.bar i{display:block;height:100%}.bar .o{background:var(--old)}.bar .s{background:var(--same);opacity:.6}.bar .n{background:var(--new)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .lo{background:var(--old)}.legend .ls{background:var(--same);opacity:.6}.legend .ln{background:var(--new)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.success{background:var(--newbg);color:var(--new)}.tag.over{background:var(--oldbg);color:var(--old)}.tag.weak{background:var(--warnbg);color:var(--warn)}.tag.mixed{background:var(--soft);color:var(--ink)}.tag.none{background:var(--soft);color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.hbar .track{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}.hbar .track i{display:block;height:100%}
.hbar .bn{background:var(--new)}.hbar .bo{background:var(--old)}
.btn{min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);font-weight:700;margin-top:6px}
.btn.primary{background:var(--ink);color:var(--bg)}
.code{width:100%;min-height:110px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{padding:12px 14px;border-radius:12px;font-size:14px}.note.info{background:var(--infobg);color:var(--info)}.note.ok{background:var(--newbg);color:var(--new)}.note.warn{background:var(--warnbg);color:var(--warn)}
</style>
</head>
<body>
<header class="top">
  <div class="t"><b>Zara app redesign · try it and give feedback</b><span>Master BIS · Designing User Interfaces · old version vs new version</span></div>
  <nav class="tabs" aria-label="Sections"><a href="#proto" id="tab-proto">Prototype &amp; feedback</a><a href="#results" id="tab-results">Results</a></nav>
</header>
<section id="view-proto">
  <p class="narrow-note">This prototype works best on a computer or tablet. On a phone, you can zoom in with two fingers.</p>
  <div id="stage-wrap"><div id="stage"></div></div>
</section>
<section id="view-results" hidden></section>
<template id="tpl">

<div style="width: 1400px; height: 1160px; box-sizing: border-box; padding: 24px 40px 0; background: #0B0B0C; color: #F2F2F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

<!-- HEADER -->
<div style="display: flex; justify-content: space-between; align-items: center">

    <div style="display: flex; flex-direction: column; gap: 3px">
      <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 15px; font-weight: 700; letter-spacing: 0.4px">MOBILE APP UI/UX REDESIGN</span><span style="padding: 2px 8px; border-radius: 4px; background: #3A2E0B; color: #FACC15; font-size: 12px; font-weight: 700">Master BIS</span></div>
      <span style="font-size: 13px; color: #A3A3A3">Interactive dual-screen prototype · Original vs. Enhanced · tap the right phone, the left phone follows · answer the questions in the middle</span>

    <button onclick="{{goFinal}}" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #FFFFFF; color: #111111; font-size: 13px; font-weight: 700; white-space: nowrap">Your final choice · {{fbDone}}/17</button>

  </div>
</div>

<!-- FLOW TABS -->
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #222222">

    <button onClick="{{item.go}}" aria-pressed="{{item.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 13px; font-weight: 600">{{item.label}}</button>
  </sc-for>
  <button onClick="{{next}}" disabled="{{atLast}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #333333; background: #141414; color: #D4D4D4; font-size: 13px">Next ›</button>
</div>

<div style="display: flex; gap: 40px; align-items: flex-start">

<!-- ====================== BEFORE PHONE ====================== -->
<div style="width: 410px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px">
  <div style="height: 28px; display: flex; align-items: center; justify-content: space-between; font-size: 12px">
    <span style="display: flex; align-items: center; gap: 8px"><span style="padding: 4px 10px; border-radius: 14px; border: 1px solid #7F1D1D; background: #2A0D0D; color: #FCA5A5; font-weight: 700">● BEFORE · ORIGINAL</span><span style="color: #A3A3A3">iPhone 16 Pro</span></span>
    <span style="font-family: 'IBM Plex Mono', monospace; color: #8A8A8A">Baseline</span>
  </div>
  <div style="width: 410px; height: 864px; box-sizing: border-box; padding: 10px; border-radius: 58px; background: #1C1C1E; box-shadow: 0 0 0 1px #2C2C2E">
  <div style="position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: {{bBg}}; color: {{bFg}}; font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column">
    <div style="height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700; position: relative; z-index: 2"><span>10:41</span><span style="width: 110px; height: 30px; border-radius: 15px; background: #000000; position: absolute; left: 140px; top: 7px"></span><span style="font-size: 12px">▮▮▮ ◔ ▭</span></div>
    <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column">

<!-- B1 HOME -->
<sc-if value="{{f.home}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: -44px 0 0 0; background: #2A2F3A; display: flex; flex-direction: column; justify-content: space-between">

<!-- B2 MENU -->

  <div style="border: 1px solid #F3A9AB; background: #FFF5F5; padding: 8px 10px; display: flex; flex-direction: column; gap: 7px">
    <span style="color: #D92D20; font-size: 9px">[08] THE FOLD-ER</span>
    <span>VIEW ALL</span><b>MARIANNE SMYTH</b><b>SOPHIA GEISS</b><b>YATEEN ADIM</b><b>VERONIKA HEILBRUNNER</b><b>MARIE VON BEHRENS</b><b>LILLY SISTO</b><b>LARISSA MILLS</b>

</div>

<!-- B3 LOOKBOOK -->
<sc-if value="{{f.lookbook}}" hint-placeholder-val="{{ false }}">

<!-- B4 SEARCH TYPING -->
<sc-if value="{{f.search_typing}}" hint-placeholder-val="{{ false }}">

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

<div style="display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 16px">
  <div style="display: flex; justify-content: space-between; align-items: center"><button onClick="{{goSearch}}" aria-label="Back" style="width: 36px; height: 36px; border: 0; background: none; color: #FFFFFF; font-size: 18px; padding: 0; text-align: left">←</button><span style="display: flex; gap: 6px"><button onClick="{{toggleSort}}" style="height: 34px; padding: 0 12px; border: 1px solid #444444; border-radius: 17px; background: #141414; color: #FFFFFF; font-size: 11px; font-weight: 700">{{sortLabel}} ⌄</button><button onClick="{{goFilter}}" style="height: 34px; padding: 0 12px; border: 1px solid #444444; border-radius: 17px; background: #141414; color: #FFFFFF; font-size: 11px; font-weight: 700">☰ FILTERS</button></span></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333333; font-size: 13px; font-weight: 700"><span>⌕ {{queryUpper}}</span><span>✕</span></div>
  <div style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; gap: 6px"><span style="padding: 5px 10px; border-radius: 14px; background: #FFFFFF; color: #111111; font-size: 10px; font-weight: 700">WOMAN</span><span style="padding: 5px 10px; border-radius: 14px; border: 1px solid #444444; font-size: 10px">MAN</span><span style="padding: 5px 10px; border-radius: 14px; border: 1px solid #444444; font-size: 10px">KIDS</span><span style="padding: 5px 10px; border-radius: 14px; border: 1px solid #A16207; color: #FACC15; font-size: 10px">SALE %</span></span><span style="font-size: 10px; color: #A3A3A3">1 · <b style="color: #FFFFFF">2</b> · 3</span></div>
  <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #A3A3A3"><span>{{resultCount}} PRODUCTS ({{dept.label}})</span><span style="color: #4ADE80">✓ Live filtered</span></div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{results}}" as="item" hint-placeholder-count="3">
      <div style="border: 1px solid #2C2C2E; border-radius: 8px; background: #141414; padding: 6px; display: flex; flex-direction: column; gap: 4px">
        <button onClick="{{goPdp}}" aria-label="Open {{item.name}}" style="height: 150px; border: 0; border-radius: 4px; background: {{item.tone}}; position: relative; padding: 0"><span style="position: absolute; left: 6px; top: 6px; padding: 2px 6px; border-radius: 3px; background: {{item.tagBg}}; color: #FFFFFF; font-size: 9px; font-weight: 700">{{item.tag}}</span></button>
        <b style="font-size: 10px">{{item.name}}</b>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; flex-direction: column"><b style="font-size: 11px">{{item.price}}</b><s style="font-size: 9px; color: #8A8A8A">{{item.was}}</s></span><button onClick="{{goBag}}" aria-label="Add {{item.name}}" style="width: 30px; height: 30px; border: 1px solid #444444; border-radius: 4px; background: #1C1C1E; color: #FFFFFF">+</button></div>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>

<!-- A6 FILTER -->
<sc-if value="{{f.filter}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 0">
  <div style="display: flex; justify-content: space-between; align-items: center"><button onClick="{{goResults}}" aria-label="Close filters" style="width: 36px; height: 36px; border: 0; background: none; color: #FFFFFF; font-size: 16px; padding: 0; text-align: left">✕</button><b style="font-size: 13px">FILTERS</b><button onClick="{{clearCats}}" style="height: 36px; border: 0; background: none; color: #FFFFFF; font-size: 12px">Clear all</button></div>
  <div style="margin: 0 -14px; padding: 10px 14px; background: #1C1C1E; display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px">
    <sc-if value="{{noCats}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-style: italic; color: #A3A3A3">No filters applied (showing all department products)</span></sc-if>
    <sc-for list="{{chips}}" as="item" hint-placeholder-count="0"><button onClick="{{item.remove}}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 14px; background: #FFFFFF; color: #111111; font-size: 11px; font-weight: 600">{{item.label}} ✕</button></sc-for>
  </div>
  <div style="border: 1px solid #333333; border-radius: 8px; background: #141414; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; font-weight: 700"><span>Sort by</span><span>›</span></div>
  <div style="border: 1px solid #333333; border-radius: 8px; background: #141414; padding: 0 12px 8px">
    <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700"><span>Categories</span><span>⌄</span></div>
    <sc-for list="{{cats}}" as="item" hint-placeholder-count="6">
      <label style="height: 30px; display: flex; align-items: center; gap: 10px; font-size: 12px"><input type="checkbox" checked="{{item.on}}" onChange="{{item.toggle}}" style="width: 16px; height: 16px; margin: 0">{{item.label}}</label>
    </sc-for>
  </div>
  <div style="border: 1px solid #333333; border-radius: 8px; background: #141414; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; font-weight: 700"><span>Colour</span><span>›</span></div>
  <div style="border: 1px solid #333333; border-radius: 8px; background: #141414; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; font-weight: 700"><span>Special Offers</span><span>›</span></div>
  <div style="margin-top: auto; padding: 12px 0 26px"><button onClick="{{goResults}}" style="width: 100%; height: 46px; border: 0; border-radius: 6px; background: #FFFFFF; color: #111111; font-size: 13px; font-weight: 700; letter-spacing: 0.5px">VIEW {{filterCount}} RESULTS</button></div>
</div>
</sc-if>

<!-- A7 PDP -->
<sc-if value="{{f.pdp}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 14px 70px">
  <div style="display: flex; justify-content: space-between; align-items: center"><button onClick="{{goResults}}" aria-label="Close" style="width: 40px; height: 44px; border: 0; background: none; font-size: 18px; padding: 0; text-align: left">✕</button>
    <span style="display: flex"><button style="width: 48px; height: 48px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px">⌑<span>Save</span></button><button style="width: 48px; height: 48px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px">⇪<span>Share</span></button><button onClick="{{goBag}}" style="width: 48px; height: 48px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px">▭<span>Bag ({{bagQty}})</span></button></span>
  </div>
  <div style="display: flex; gap: 12px">
    <div style="width: 150px; height: 200px; flex: 0 0 auto; border-radius: 6px; background: {{pdpTone}}; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <svg width="{{zoomW}}" height="{{zoomH}}" viewBox="0 0 24 24" fill="rgba(255,255,255,0.3)" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M8.5 7.5h7l1.5 9h-2l-.5 6h-5l-.5-6h-2z"/></svg>
      <span style="position: absolute; left: 6px; top: 6px; padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.9); font-size: 9px; font-weight: 600">Pinch to zoom</span>
      <span style="position: absolute; left: 6px; bottom: 6px; display: flex; flex-direction: column; gap: 4px"><button onClick="{{zoomIn}}" aria-label="Zoom in" style="width: 28px; height: 28px; border: 0; border-radius: 14px; background: #FFFFFF">+</button><button onClick="{{zoomOut}}" aria-label="Zoom out" style="width: 28px; height: 28px; border: 0; border-radius: 14px; background: #FFFFFF">−</button></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <b style="font-size: 14px; line-height: 1.3">RELAXED FIT HIGH NECK COAT</b>
      <b style="font-size: 16px">$129.00</b>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B6B6B; margin-top: 18px">COLOR: <b style="color: #111111">{{colorName}}</b></span>
      <span style="display: flex; gap: 6px"><sc-for list="{{colors}}" as="item" hint-placeholder-count="3"><button onClick="{{item.pick}}" aria-label="{{item.name}}" aria-pressed="{{item.pressed}}" style="width: 32px; height: 32px; border-radius: 4px; border: 2px solid {{item.ring}}; padding: 2px; background: #FFFFFF"><span style="display: block; width: 100%; height: 100%; border-radius: 2px; background: {{item.hex}}"></span></button></sc-for></span>
      <span style="font-size: 10px; color: #6B6B6B">188 cm · Size L</span>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">SIZE</b><span style="font-size: 11px; text-decoration: underline">Size recommender</span></div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{sizes}}" as="item" hint-placeholder-count="4"><button onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="height: 40px; border-radius: 4px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 13px; font-weight: 700">{{item.label}}</button></sc-for>
  </div>
  <button onClick="{{addToBag}}" style="height: 56px; border: 0; border-radius: 6px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 700; letter-spacing: 1px">ADD TO BAG · {{size}}</button>
  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #6B6B6B">DETAILS &amp; COMPOSITION (1 OPEN AT A TIME)</span>
  <sc-for list="{{accordion}}" as="item" hint-placeholder-count="4">
    <div style="border: 1px solid #E5E5E5; border-radius: 6px; padding: 0 12px">
      <button onClick="{{item.toggle}}" aria-expanded="{{item.expanded}}" style="width: 100%; height: 42px; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 0; font-size: 12px; font-weight: 700; text-align: left"><span>{{item.label}}</span><span>{{item.chev}}</span></button>
      <sc-if value="{{item.open}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 10px; font-size: 12px; line-height: 1.5; color: #3D3D3D">{{item.body}}</p></sc-if>
    </div>
  </sc-for>
</div>
</sc-if>

<!-- A8 BAG -->
<sc-if value="{{f.bag}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0; font-size: 12px">
  <div style="display: flex; justify-content: space-between"><button onClick="{{goHome}}" aria-label="Close" style="width: 36px; height: 36px; border: 0; background: none; font-size: 16px; padding: 0; text-align: left">✕</button><span style="font-size: 16px">▭</span></div>
  <div style="display: flex; gap: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 11px"><b style="border-bottom: 2px solid #111111; padding-bottom: 4px">SHOPPING BAG | {{bagQty}} |</b><span style="color: #6B6B6B">FAVOURITES</span></div>
  <div style="display: flex; gap: 12px">
    <div style="width: 76px; height: 100px; background: #EFEFEF; border-radius: 4px; display: flex; align-items: center; justify-content: center"><div style="width: 48px; height: 58px; background: {{bagTone}}"></div></div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
      <b style="font-size: 12px">{{bagName}}</b>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: #555555">BLACK
        <label style="position: absolute; left: -9999px" for="bs">Size</label>
        <select id="bs" value="{{bagSize}}" onChange="{{changeBagSize}}" style="height: 30px; padding: 0 6px; border: 1.5px solid #111111; border-radius: 4px; background: #FFFFFF; font-size: 11px; font-weight: 700; color: #111111">
          <option value="S">SIZE: S</option><option value="M">SIZE: M</option><option value="L">SIZE: L · ONLY 2 LEFT</option><option value="XL" disabled>SIZE: XL · SOLD OUT</option>
        </select>
      </span>
      <sc-if value="{{lowStock}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; color: #B45309; font-weight: 600">Only 2 left in size L</span></sc-if>
      <b>{{bagPrice}}</b>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #555555"><span style="display: flex; align-items: center; border: 1px solid #D4D4D4; border-radius: 4px"><button onClick="{{dec}}" aria-label="Fewer" style="width: 28px; height: 28px; border: 0; background: none">−</button><b style="color: #111111">{{bagQty}}</b><button onClick="{{inc}}" aria-label="More" style="width: 28px; height: 28px; border: 0; background: none">+</button></span><span>DELETE | ⌑</span></div>
    </div>
  </div>
  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #6B6B6B; padding-top: 10px; border-top: 1px solid #E5E5E5">YOU MAY ALSO LIKE</span>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 10px">
    <div style="border: 1px solid #E5E5E5; border-radius: 4px; padding: 5px"><div style="height: 60px; background: #B2875B"></div><div style="margin-top: 4px">Faux Trench</div><div style="color: #6B6B6B">$89.00</div></div>
    <div style="border: 1px solid #E5E5E5; border-radius: 4px; padding: 5px"><div style="height: 60px; background: #E9E4D8"></div><div style="margin-top: 4px">Knit Cardigan</div><div style="color: #6B6B6B">$59.00</div></div>
    <div style="border: 1px solid #E5E5E5; border-radius: 4px; padding: 5px"><div style="height: 60px; background: #1E2838"></div><div style="margin-top: 4px">Pleated Skirt</div><div style="color: #6B6B6B">$89.00</div></div>
  </div>
  <div style="margin-top: auto; padding: 12px 0 26px; border-top: 1px solid #E5E5E5; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-weight: 700"><span>TOTAL</span><span>{{bagTotal}}</span></div><span style="font-size: 10px; color: #6B6B6B; text-align: right">* VAT included</span><button onClick="{{goCheckout}}" style="height: 46px; border: 0; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 1px">CONTINUE ({{bagQty}})</button></div>
</div>
</sc-if>

<!-- A9 CHECKOUT -->
<sc-if value="{{f.checkout}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0; font-size: 12px">
  <button onClick="{{goBag}}" style="align-self: flex-start; height: 36px; border: 0; background: none; padding: 0; font-size: 12px; font-weight: 700">← BACK TO BAG</button>
  <b style="font-size: 14px">REVIEW AND CONFIRM ORDER</b>
  <div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600"><span style="color: #15803D">✓ BAG</span><span style="flex: 1 1 auto; height: 1px; background: #111111"></span><span style="color: #15803D">✓ DELIVERY</span><span style="flex: 1 1 auto; height: 1px; background: #111111"></span><span style="border-bottom: 2px solid #111111">PAYMENT</span><span style="flex: 1 1 auto; height: 1px; background: #D4D4D4"></span><span style="color: #8A8A8A">DONE</span></div>
  <div style="border: 1px solid #E5E5E5; border-radius: 6px; padding: 10px; display: flex; gap: 10px; align-items: center"><span style="width: 40px; height: 48px; background: {{bagTone}}"></span><span style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 11px">{{bagName}}</b><span style="font-size: 10px; color: #6B6B6B">SIZE {{bagSize}} · BLACK · QTY {{bagQty}}</span></span></div>
  <div style="padding: 10px 0; border-bottom: 1px solid #E5E5E5; display: flex; justify-content: space-between"><span style="display: flex; flex-direction: column; gap: 3px"><b>SHIPPING METHOD</b><span style="font-size: 11px; color: #555555">Home Delivery · Ho Chi Minh City</span></span><span style="font-size: 11px; text-decoration: underline">Edit</span></div>
  <div style="padding: 10px 0; border-bottom: 1px solid #E5E5E5; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><b>DELIVERY DATE</b><span style="padding: 1px 6px; border-radius: 3px; background: #DCFCE7; color: #15803D; font-size: 10px; font-weight: 700">FREE</span></span><span style="font-size: 11px">THURSDAY 29</span><span style="font-size: 10px; color: #6B6B6B">Free shipping on orders over $50.00</span></div>
  <div style="padding: 10px 0; display: flex; justify-content: space-between"><span style="display: flex; flex-direction: column; gap: 3px"><b>PAYMENT METHOD</b><span style="font-size: 11px; color: #555555">Apple Pay · Visa ****4092</span></span><span style="font-size: 11px; text-decoration: underline">Edit</span></div>
  <button onClick="{{goBag}}" style="align-self: center; height: 36px; border: 0; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-decoration: underline">CANCEL AND RETURN TO BAG</button>
  <div style="margin-top: auto; padding: 12px 0 26px; border-top: 1px solid #E5E5E5; display: flex; flex-direction: column; gap: 8px"><div style="display: flex; justify-content: space-between; font-weight: 700"><span>TOTAL</span><span>{{bagTotal}}</span></div><button onClick="{{goPayment}}" style="height: 46px; border: 0; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 1px">AUTHORISE PAYMENT</button></div>
</div>
</sc-if>

<!-- A10 PAYMENT RESULT -->
<sc-if value="{{f.payment_result}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0; font-size: 12px">
  <div style="display: flex; justify-content: space-between; align-items: center"><button onClick="{{goHome}}" aria-label="Close" style="width: 36px; height: 36px; border: 0; background: none; font-size: 16px; padding: 0; text-align: left">✕</button><button onClick="{{togglePaid}}" style="height: 28px; padding: 0 10px; border: 1px solid #D4D4D4; border-radius: 4px; background: #FAFAFA; font-size: 10px">Toggle: {{paidToggleLabel}}</button></div>
  <sc-if value="{{cancelled}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div><div style="display: flex; align-items: center; gap: 6px; color: #DC2626; font-weight: 700; font-size: 13px">ⓘ PAYMENT CANCELLED</div><b style="font-size: 15px">YOUR ORDER WAS NOT PLACED</b></div>
      <div style="border: 1px solid #E5E5E5; border-radius: 6px; padding: 10px; display: flex; gap: 10px; align-items: center"><span style="width: 40px; height: 48px; background: {{bagTone}}"></span><span style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 11px">{{bagName}}</b><span style="font-size: 10px; color: #6B6B6B">{{bagTotal}}</span></span></div>
      <div style="border: 1px solid #86EFAC; border-radius: 8px; background: #F0FDF4; padding: 12px; font-size: 12px; line-height: 1.5; color: #14532D">You have <b>not been charged</b>. Your items are still safely saved in your shopping bag.</div>
      <button onClick="{{goCheckout}}" style="height: 44px; border: 0; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 1px">TRY AGAIN</button>
      <button onClick="{{goCheckout}}" style="height: 44px; border: 1.5px solid #111111; border-radius: 4px; background: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 1px">CHANGE PAYMENT METHOD</button>
      <button onClick="{{goBag}}" style="align-self: center; height: 32px; border: 0; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-decoration: underline">BACK TO BAG</button>
    </div>
  </sc-if>
  <sc-if value="{{paid}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div><div style="display: flex; align-items: center; gap: 6px; color: #15803D; font-weight: 700; font-size: 13px">✓ PAYMENT SUCCESSFUL</div><b style="font-size: 15px">YOUR ORDER IS PLACED</b></div>
      <div style="border: 1px solid #E5E5E5; border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.5">Order number [#000000] · estimated delivery Thursday 29, October.</div>
      <button onClick="{{goHome}}" style="height: 44px; border: 0; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 1px">CONTINUE SHOPPING</button>
    </div>
  </sc-if>
  <span style="margin-top: auto; padding: 14px 0 26px; text-align: center; font-size: 11px; color: #6B6B6B">Need help? <b style="color: #111111">Chat with us</b></span>
</div>
</sc-if>

<!-- A11 COOKIE -->
<sc-if value="{{f.cookie}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 24px 22px 0">
  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4ADE80">⛨ GDPR &amp; CCPA COMPLIANT</span>
  <b style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.5px">USE OF COOKIES</b>
  <span style="font-size: 12px; line-height: 1.55; color: #D4D4D4">We use first-party and third-party cookies to understand store usage and personalize content. You can accept all cookies, reject non-essential cookies with one tap, or customize your preferences at any time.</span>
  <span style="padding: 10px; background: #1C1C1E; border-radius: 6px; font-size: 11px; line-height: 1.5; color: #A3A3A3">GDPR Art. 7(3): Equal visual weight &amp; 48px touch height on both primary choices.</span>
  <sc-if value="{{granular}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; border-top: 1px solid #333333">
      <sc-for list="{{cookieRows}}" as="item" hint-placeholder-count="3">
        <div style="height: 50px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333333; font-size: 12px"><span>{{item.label}}</span><button onClick="{{item.toggle}}" disabled="{{item.locked}}" role="switch" aria-checked="{{item.checked}}" aria-label="{{item.label}}" style="width: 46px; height: 28px; border: 0; border-radius: 14px; padding: 3px; background: {{item.track}}; display: flex; justify-content: {{item.justify}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></button></div>
      </sc-for>

        prefBtns: [["old","Old"],["same","Same"],["new","New"]].map(function(b){ var on = s.fb[id] && s.fb[id].p === b[0];
          var c = { old:"#F87171", same:"#D4D4D4", new:"#4ADE80" }[b[0]];
          return { label: b[1], pressed: String(!!on), bg: on ? c : "#111827", fg: on ? "#111111" : "#E5E5E5", bd: on ? "transparent" : "#334155", pick: setFb(id, "p", b[0]) }; }) });
    });
    v.flowTabs = v.flowTabs.map(function(t, i){ var ok = MF[F[i][0]].notes.every(complete); return Object.assign({}, t, { label: (ok ? "✓ " : "") + t.label }); });
    v.flow = s.flow; v.flowNo = idx + 1; v.fbDone = done; v.fbPct = Math.round(100 * done / FN.length);
    v.viewProto = s.view === "proto"; v.viewFinal = s.view === "final"; v.viewDone = s.view === "done"; v.viewCopy = s.view === "copy";
    v.goFinal = function(){ self.setState({ view: "final", send: "" }); };
    v.backToProto = function(){ self.setState({ view: "proto" }); };
    v.nextOrFinal = function(){ if (idx < F.length - 1) self.setState({ flow: F[idx + 1][0] }); else self.setState({ view: "final", send: "" }); };
    v.nextLabel = idx < F.length - 1 ? "Next screen: " + F[idx + 1][1] + " ›" : "Go to your final choice ›";
    var setFin = function(k, fromEvent){ return function(e){ var f = Object.assign({}, self.state.fin); f[k] = fromEvent ? e.target.value : e; self.setState({ fin: f }); }; };
    v.fin = s.fin;
    v.freqOpts = [["","Choose one"],["never","Never"],["year","Once a year or less"],["months","Every few months"],["monthly","About once a month"],["weekly","Every week"]].map(function(o){ return { v:o[0], t:o[1] }; });
    v.likeOpts = [{ v:"", t:"Choose one" }].concat(FN.map(function(f){ return { v:f.id, t:f.n }; }));
    v.keepOpts = [{ v:"", t:"Choose one" }, { v:"none", t:"Nothing: the new version is better everywhere" }].concat(FN.map(function(f){ return { v:f.id, t:f.o }; }));
    v.setFreq = setFin("freq", true); v.setLike = setFin("likeMost", true); v.setKeep = setFin("keepOld", true); v.setToo = setFin("tooMuch", true); v.setNeed = setFin("needsWork", true);
    v.overallBtns = [1,2,3,4,5].map(function(n){ var on = s.fin.overall === n; return { label:String(n), pressed:String(on), bg: on ? "#FFFFFF" : "#111827", fg: on ? "#111111" : "#E5E5E5", bd: on ? "#FFFFFF" : "#334155",
      pick: function(){ var f = Object.assign({}, self.state.fin); f.overall = n; self.setState({ fin: f }); } }; });
    v.missingAny = done < FN.length;
    var ready = !!(s.fin.likeMost && s.fin.keepOld && s.fin.overall);
    v.cantSend = !ready || s.send === "sending"; v.sendBg = ready ? "#FFFFFF" : "#6B7280";
    v.sending = s.send === "sending"; v.sendError = s.send === "error";
    v.send = function(){
      var b = self.body();
      if (!DBX.db || !DBX.uid || DBX.canWrite === false){ self.setState({ view: "copy", copyMsg: "" }); return; }
      self.setState({ send: "sending" });
      DBX.db.collection("responses").doc(DBX.uid).set(b).then(function(){ self.setState({ send: "", view: "done" }); },
        function(err){ if (err && err.code === "invalid_argument"){ DBX.canWrite = false; self.setState({ send: "", view: "copy" }); } else self.setState({ send: "error" }); });
    };
    v.answerCode = s.view === "copy" ? encodeResp(this.body()) : "";
    v.copyMsg = s.copyMsg;
    v.copyCode = function(){ var code = encodeResp(self.body()); var ta = document.getElementById("fcode"); if (ta) ta.select();
      try { navigator.clipboard.writeText(code).then(function(){ self.setState({ copyMsg: "Copied. Paste it into a message to the team." }); }, function(){ self.setState({ copyMsg: "Select the code and press Ctrl+C / Cmd+C." }); }); }
      catch(e){ self.setState({ copyMsg: "Select the code and press Ctrl+C / Cmd+C." }); } };
    return v;
  }
}

/* ===== Results ===== */
function aggregate(list){
  var st = {}; FN.forEach(function(f){ st[f.id] = { cnt:0, old:0, same:0, nw:0, so:0, co:0, sn:0, cn:0, oB:0, oW:0, nB:0, nW:0, like:0, keep:0 }; });
  var ov = 0, ovN = 0, keepNone = 0, too = [], need = [];
  list.forEach(function(r){
    Object.keys(r.ratings).forEach(function(k){ var x = r.ratings[k], t = st[k];
      if (x.p){ t.cnt++; if (x.p === "old") t.old++; else if (x.p === "same") t.same++; else t.nw++; }
      if (x.o){ t.so += x.o; t.co++; if (x.o >= 4) t.oB++; if (x.o <= 2) t.oW++; }
      if (x.n){ t.sn += x.n; t.cn++; if (x.n >= 4) t.nB++; if (x.n <= 2) t.nW++; } });
    if (st[r.likeMost]) st[r.likeMost].like++;
    if (r.keepOld === "none") keepNone++; else if (st[r.keepOld]) st[r.keepOld].keep++;
    if (r.overall){ ov += r.overall; ovN++; }
    if (r.tooMuch && r.tooMuch.trim()) too.push(r.tooMuch.trim());
    if (r.needsWork && r.needsWork.trim()) need.push(r.needsWork.trim());
  });
  return { st:st, n:list.length, overall: ovN ? ov / ovN : 0, keepNone:keepNone, too:too, need:need };
}
function avg(sum, c){ return c ? sum / c : 0; }
function verdict(t, N){
  var n = t.cnt; if (!n) return { k:"none", t:"No data yet" };
  var aO = avg(t.so, t.co), aN = avg(t.sn, t.cn), nW = t.cn ? t.nW / t.cn : 0;
  if (t.old / n >= 0.40 || (N && t.keep / N >= 0.25) || (t.co && t.cn && aO > aN)) return { k:"over", t:"Over-changed" };
  if (nW >= 0.25 || t.same / n >= 0.50 || (t.cn && aN < 3.5)) return { k:"weak", t:"Not upgraded well" };
  if (t.nw / n >= 0.60 && aN >= 4 && nW < 0.20) return { k:"success", t:"Successful upgrade" };
  return { k:"mixed", t:"Mixed" };
}
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){ var v = attrs[k];
    if (k === "text") e.textContent = v; else if (k === "on") Object.keys(v).forEach(function(x){ e.addEventListener(x, v[x]); });
    else if (k === "class") e.className = v; else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v); });
  (kids || []).forEach(function(c){ if (c == null) return; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function pct(x, n){ return n ? Math.round(100 * x / n) : 0; }
function stars(a){ return a ? a.toFixed(1) : "–"; }

function renderResults(host){
  host.innerHTML = "";
  var box = h("div", { class:"res" });
  if (DBX.load === "loading") box.appendChild(h("div", { class:"note info", text:"Loading results…" }));
  if (DBX.load === "slow") box.appendChild(h("div", { class:"note warn", text:"The results cannot be reached yet. They will appear when the connection is back." }));
  if (DBX.load === "none") box.appendChild(h("div", { class:"note warn", text:"Results are not available in this view. Open the page from its claude.ai link while signed in." }));
  var A = aggregate(DBX.responses), N = A.n, S = A.st;
  var rows = FN.map(function(f){ var t = S[f.id]; return { f:f, t:t, v:verdict(t, N), aO:avg(t.so, t.co), aN:avg(t.sn, t.cn) }; });
  var cnt = function(k){ return rows.filter(function(r){ return r.v.k === k; }).length; };
  box.appendChild(h("div", { class:"kpis" }, [
    h("div", { class:"kpi" }, [ h("b", { text:String(N) }), h("span", { text:"testers" }) ]),
    h("div", { class:"kpi" }, [ h("b", { text: A.overall ? A.overall.toFixed(1) + " / 5" : "–" }), h("span", { text:"“New is better” score" }) ]),
    h("div", { class:"kpi" }, [ h("b", { class:"c-new", text:String(cnt("success")) }), h("span", { text:"successful upgrades" }) ]),
    h("div", { class:"kpi" }, [ h("b", { class:"c-old", text:String(cnt("over")) }), h("span", { text:"over-changed" }) ]),
    h("div", { class:"kpi" }, [ h("b", { class:"c-warn", text:String(cnt("weak")) }), h("span", { text:"not upgraded well" }) ])
  ]));

  var rank = function(key, dir, min){ return rows.filter(function(r){ return r[key] > 0; }).sort(function(a, b){ return dir * (a[key] - b[key]); }).slice(0, 3); };
  var lst = function(title, list, key, cls){ return h("div", { class:"card" }, [ h("h3", { text:title }),
    list.length ? h("ol", { class:"rank" }, list.map(function(r){ return h("li", null, [ h("span", { text: key === "aO" ? r.f.o : r.f.n }), h("b", { class:cls, text: stars(r[key]) + " / 5" }) ]); })) : h("p", { class:"hint", text:"No answers yet." }) ]); };
  box.appendChild(h("h2", { text:"Best and worst functions" }));
  box.appendChild(h("div", { class:"cols4" }, [
    lst("Best in the OLD version", rank("aO", -1), "aO", "c-new"), lst("Worst in the OLD version", rank("aO", 1), "aO", "c-old"),
    lst("Best in the NEW version", rank("aN", -1), "aN", "c-new"), lst("Worst in the NEW version", rank("aN", 1), "aN", "c-old") ]));

  var tb = h("tbody");
  rows.forEach(function(r){ var t = r.t, n = t.cnt;
    tb.appendChild(h("tr", null, [
      h("td", null, [ h("div", { class:"fname", text:r.f.n }), h("div", { class:"hint", text:r.f.g }) ]),
      h("td", null, [ h("div", { class:"bar", role:"img", "aria-label":"Old " + pct(t.old, n) + "%, same " + pct(t.same, n) + "%, new " + pct(t.nw, n) + "%" }, [
        h("i", { class:"o", style:"width:" + pct(t.old, n) + "%" }), h("i", { class:"s", style:"width:" + pct(t.same, n) + "%" }), h("i", { class:"n", style:"width:" + pct(t.nw, n) + "%" }) ]),
        h("div", { class:"hint", text: pct(t.old, n) + "% old · " + pct(t.same, n) + "% same · " + pct(t.nw, n) + "% new" }) ]),
      h("td", { class:"num", text: stars(r.aO) }), h("td", { class:"num", text: stars(r.aN) }),
      h("td", { class:"num", text: t.oB + " / " + t.oW }), h("td", { class:"num", text: t.nB + " / " + t.nW }),
      h("td", { class:"num", text:String(t.like) }), h("td", { class:"num", text:String(t.keep) }),
      h("td", null, [ h("span", { class:"tag " + r.v.k, text:r.v.t }) ]) ])); });
  box.appendChild(h("div", { class:"card" }, [ h("h2", { text:"Every function: old vs new" }),
    h("div", { class:"legend" }, [ h("span", null, [ h("i", { class:"lo" }), "Prefer old" ]), h("span", null, [ h("i", { class:"ls" }), "Same" ]), h("span", null, [ h("i", { class:"ln" }), "Prefer new" ]) ]),
    h("div", { class:"scroll" }, [ h("table", { class:"tbl" }, [ h("thead", null, [ h("tr", null, ["Function","Which version?","Old score","New score","Old good / bad","New good / bad","Liked most","Keep old","Result"].map(function(x){ return h("th", { text:x }); })) ]), tb ]) ]),
    h("p", { class:"hint", text:"Score = average from 1 to 5. Good = 4 or 5. Bad = 1 or 2." }) ]));

  var group = function(k, title, why){ var it = rows.filter(function(r){ return r.v.k === k; });
    return h("div", { class:"card" }, [ h("h3", null, [ h("span", { class:"tag " + k, text:title }) ]), h("p", { class:"hint", text:why }),
      it.length ? h("ul", { class:"plain" }, it.map(function(r){ return h("li", { text:r.f.n }); })) : h("p", { class:"hint", text:"None so far." }) ]); };
  box.appendChild(h("h2", { text:"What we learn" }));
  box.appendChild(h("div", { class:"cols3" }, [
    group("over", "Over-changed", "40%+ prefer the old way, OR 25%+ want to keep it, OR the old one scores higher than the new one."),
    group("weak", "Not upgraded well", "25%+ give the new one 1 or 2, OR 50%+ see no difference, OR the new score is below 3.5."),
    group("success", "Successful upgrade", "60%+ prefer the new way, the new score is 4+, and fewer than 20% give it 1 or 2.") ]));

  var top = function(key){ return FN.map(function(f){ return { label:f.n, v:S[f.id][key] }; }).filter(function(r){ return r.v > 0; }).sort(function(a, b){ return b.v - a.v; }).slice(0, 6); };
  var hb = function(title, list, cls){ var mx = Math.max.apply(null, [1].concat(list.map(function(r){ return r.v; })));
    return h("div", { class:"card" }, [ h("h3", { text:title }), list.length ? h("div", null, list.map(function(r){ return h("div", { class:"hbar" }, [ h("span", { text:r.label }), h("span", { class:"track" }, [ h("i", { class:cls, style:"width:" + (100 * r.v / mx) + "%" }) ]), h("b", { text:String(r.v) }) ]); })) : h("p", { class:"hint", text:"No answers yet." }) ]); };
  var keepList = top("keep"); if (A.keepNone) keepList.push({ label:"Nothing (new is better everywhere)", v:A.keepNone });
  box.appendChild(h("div", { class:"cols2" }, [ hb("Liked most in the NEW version", top("like"), "bn"), hb("Want to KEEP from the OLD version", keepList, "bo") ]));
  box.appendChild(h("div", { class:"cols2" }, [
    h("div", { class:"card" }, [ h("h3", { text:"“We changed too much”" }), A.too.length ? h("ul", { class:"plain" }, A.too.map(function(t){ return h("li", { text:t }); })) : h("p", { class:"hint", text:"No comments yet." }) ]),
    h("div", { class:"card" }, [ h("h3", { text:"“Still not good enough”" }), A.need.length ? h("ul", { class:"plain" }, A.need.map(function(t){ return h("li", { text:t }); })) : h("p", { class:"hint", text:"No comments yet." }) ]) ]));

  var msg = h("p", { class:"hint" });
  var csv = function(){ var L = [["function","group","prefer_old","same","prefer_new","old_score","new_score","old_good","old_bad","new_good","new_bad","liked_most","keep_old","result"].join(",")];
    rows.forEach(function(r){ var t = r.t; L.push(['"' + r.f.n.replace(/"/g, '""') + '"', '"' + r.f.g + '"', t.old, t.same, t.nw, stars(r.aO), stars(r.aN), t.oB, t.oW, t.nB, t.nW, t.like, t.keep, '"' + r.v.t + '"'].join(",")); }); return L.join("\n"); };
  box.appendChild(h("div", { class:"card" }, [ h("h3", { text:"Use the results in your report" }), h("p", { class:"hint", text:"Copy the table as CSV and paste it into Excel or Google Sheets." }),
    h("button", { class:"btn", type:"button", text:"Copy results as CSV", on:{ click:function(){ try { navigator.clipboard.writeText(csv()).then(function(){ msg.textContent = "Copied."; }, function(){ msg.textContent = "Copy was blocked by the browser."; }); } catch(e){ msg.textContent = "Copy was blocked by the browser."; } } } }), msg ]));

  if (DBX.isAdmin && DBX.db){

    box.appendChild(h("div", { class:"card" }, [ h("h3", { text:"Add answers sent by testers" }), h("p", { class:"hint", text:"Testers who cannot save here get an answer code. Paste their codes below." }), ta,
      h("button", { class:"btn primary", type:"button", text:"Add answers", on:{ click:function(){
        var parts = ta.value.split(/\s+/).filter(Boolean), ok = 0, bad = 0, ch = Promise.resolve();
        parts.forEach(function(p){ var o = cleanResp(decodeResp(p)); if (!o){ bad++; return; } ok++;
          ch = ch.then(function(){ return DBX.db.collection("responses").doc("imp-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)).set(o); }); });
        ch.then(function(){ DBX.importMsg = ok + " answer(s) added" + (bad ? ", " + bad + " code(s) not valid" : "") + "."; renderResults(host); }, function(){ DBX.importMsg = "Could not add the answers. Please try again."; renderResults(host); });
      } } }), DBX.importMsg ? h("div", { class:"note ok", text:DBX.importMsg }) : null ]));
  }
  host.appendChild(box);
}

/* ===== Page shell ===== */
function route(){ return location.hash === "#results" ? "results" : "proto"; }
function fit(){
  var wrap = document.getElementById("stage-wrap"), stage = document.getElementById("stage");
  if (!wrap || !stage) return;
  var k = Math.min(1, wrap.clientWidth / 1400);
  stage.style.transform = "scale(" + k + ")"; wrap.style.height = Math.ceil(1160 * k) + "px";
}
function show(){
  var r = route();
  document.getElementById("view-proto").hidden = r !== "proto";
  document.getElementById("view-results").hidden = r !== "results";
  document.getElementById("tab-proto").setAttribute("aria-current", r === "proto" ? "page" : "false");
  document.getElementById("tab-results").setAttribute("aria-current", r === "results" ? "page" : "false");
  if (r === "results") renderResults(document.getElementById("view-results")); else fit();
}
window.addEventListener("hashchange", function(){ show(); window.scrollTo(0, 0); });
window.addEventListener("resize", fit);

__tpl = document.getElementById("tpl");
__root = document.getElementById("stage");
__comp = new Merged({});
__render(); show();

var slow = setTimeout(function(){ if (DBX.load === "loading"){ DBX.load = "slow"; if (route() === "results") show(); } }, 10000);
Promise.all([ window.claude ? claude.use("db") : null, window.claude ? claude.use("user") : null ]).then(function(res){
  DBX.db = res[0]; var user = res[1];
  if (!DBX.db){ clearTimeout(slow); DBX.load = "none"; if (route() === "results") show(); return; }
  return Promise.all([ user ? user.id() : null, user && user.can ? user.can("data.write") : null, user && user.canEdit ? user.canEdit() : false ]).then(function(v){
    DBX.uid = v[0]; DBX.canWrite = v[1] === false ? false : (v[1] === true ? true : null); DBX.isAdmin = !!v[2];
    DBX.db.collection("responses").onSnapshot(function(snap){
      DBX.responses = snap.docs.map(function(d){ return cleanResp(d.data()); }).filter(Boolean);
      if (!snap.metadata.fromCache) clearTimeout(slow);
      DBX.load = "ok"; if (route() === "results") show();
    }, function(){ clearTimeout(slow); DBX.load = "slow"; if (route() === "results") show(); });
  });
}).catch(function(){ clearTimeout(slow); DBX.load = "none"; if (route() === "results") show(); });
